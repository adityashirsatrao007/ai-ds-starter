name: DVC Pipeline

on:
  push:
    paths:
      - "data/**"
      - "src/**"
      - "dvc.yaml"
      - "dvc.lock"
      - ".dvc/**"
      - "params.yaml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: "requirements.txt"

      - name: Cache DVC
        uses: actions/cache@v6
        with:
          path: |
            .dvc/cache
            .dvc/tmp
          key: dvc-${{ hashFiles('dvc.lock', 'dvc.yaml') }}
          restore-keys: |
            dvc-

      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install dvc

      - name: Pull DVC data
        run: dvc pull --run-cache || echo "No remote configured yet"

      - name: Reproduce pipeline
        run: dvc repro

      - name: Push results
        run: |
          dvc push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dvc.lock .dvc/ metrics.json
          git diff --quiet && echo "No changes" || git commit -m "chore: update DVC pipeline [skip ci]"
          git push
