name: Auto-label PRs
on:
  pull_request:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@ac9175f8a1f3625fd0d4fb4445367df947f283e4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
