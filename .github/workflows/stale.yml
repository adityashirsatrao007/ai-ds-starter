name: Close stale issues
on:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue is stale. Mark as active or it will be closed.'
          days-before-stale: 60
          days-before-close: 7
